[project]
name = "advvidedl"
version = "0.1.0"
description = "Pobiera wszystkie filmy z katalogu vider.info, rozwiązując captchę modelem DeepSeek."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.scripts]
advvidedl = "advvidedl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
